<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta charset="utf-8" />
    <title>Simple_Monitor</title>

    <!-- WinJS 引用 -->
    <link href="//Microsoft.WinJS.1.0/css/ui-dark.css" rel="stylesheet" />
    <script src="//Microsoft.WinJS.1.0/js/base.js"></script>
    <script src="//Microsoft.WinJS.1.0/js/ui.js"></script>

    <!-- Simple_Monitor 引用 -->
    <link href="/css/default.css" rel="stylesheet" />
    <script src="/js/default.js"></script>
    <script>
        function comeoutAppBar() {
            document.getElementById("appBar").winControl.show();
        }
        function showSettings() {
            var settingsFlyout = document.getElementById("settingsFlyout").winControl;
            var settingsButton = document.getElementById("settingsButton").winControl;
            settingsFlyout.show(settingsButton);
        }
        function clear2() {
            document.getElementById("errors").textContent = "";
            document.getElementById("shapes").textContent = "";
        }
    </script>
</head>
<body style="background-color:#323F83;"> 
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-size: cover; background-position: center;">
        <video width="100%" height="100%" id="monitor" style="border: 1px solid black; "></video>
    </div>
    <p id="shapes" style="white-space:pre-line;color:deeppink;"></p>
    <p id="errors" style="white-space: pre-line; color: red;"></p>
    <div id="appBar" data-win-control="WinJS.UI.AppBar" style="background-color:#485CC7;">
        <button data-win-control="WinJS.UI.AppBarCommand" id="settingsButton"
            data-win-options="{label:'选项 Opt.', icon:'settings', section:'selection', tooltip:'切换摄像头 Switch camera'}"
            onclick="showSettings();">
        </button>
        <button data-win-control="WinJS.UI.AppBarCommand" id="dismissButton"
            data-win-options="{label:'清除 Clr.', icon:'&#xE106;', section:'selection', tooltip:'清除日志 Clear the log'}"
            onclick="clear2();">
        </button>
        <button data-win-control="WinJS.UI.AppBarCommand" id="aboutButton"
            data-win-options="{label:'关于 About', icon:'emoji2', section:'global', tooltip:'关于本程序 About this program'}"
            onclick="about();">
        </button>
    </div>

    <div class="win-bottomlayout" id="bar-to-show-appbar" onclick="document.getElementById('appBar').winControl.show();"><span>•••</span></div>
    <style>
        .win-bottomlayout {
            background-color: gray; /* 可以设置成其他值，设置半透明也可。主要是为了区分能识别出这个位置有个 Bar */
            position: absolute; top: auto; text-align: center;
            height: 15px; bottom: 0px; left: 0px; right: 0px; overflow: hidden;
            display: -ms-flexbox;   /* IE Flex容器 */
            -ms-flex-pack: center;  /* 主轴居中 */
            opacity: 0.24;
        }
        .win-bottomlayout > span { position: absolute; right: 56px; left: auto; color: white; top: -2px; }
    </style>
    <div id="settingsFlyout" data-win-control="WinJS.UI.Flyout">
        <select id="cameraSelect" aria-labelledby="listLabel"></select>
        <br />
        <input type="button" value="Start Device" id="btnStartDevice" style="" />
        <input type="button" value="Start Monitor" id="btnStartPreview" style="display: none;" />
    </div>
    
</body>
</html>
